version: "1.0.0"
updated_at: "2026-10-13"
decisions:
  - id: GWAP-ARCH-001
    title: "GWAP ecosystem separation"
    status: PRODUCTION
    owner_system: GWAP_MASTER
    decision: "Keep identity, reputation, proof/commerce, application orchestration, payments, and digital assets as separate bounded domains."
    review_trigger: "Major product merger or protocol ownership change."
  - id: GWAP-PPV-001
    title: "PPV staged deployment"
    status: DEVNET_VERIFIED
    owner_system: PPV
    decision: "Core and Commerce may integrate on devnet; Escrow/custody remains gated; mainnet custody disabled."
    review_trigger: "Explicit mainnet custody authorization and security review."
  - id: GWAP-PAY-001
    title: "Separate payment responsibilities"
    status: RESEARCHED
    owner_system: GwapOS
    decision: "Stripe, MPP/x402 Pay/Pay Kit, Kora, and PPV serve different boundaries and must not be collapsed into one payment subsystem."
    review_trigger: "Production agentic-payment or fee-sponsorship launch."
  - id: GWAP-ASSET-001
    title: "Digital assets are outcome-driven"
    status: PRODUCTION
    owner_system: GwapMojis
    decision: "Do not tokenize by default. Compare off-chain state, custom state, Token-2022, MPL Core, Token Metadata, Bubblegum, and validated inscription primitives."
    review_trigger: "Optional Solana minting enters implementation."
  - id: GWAP-GWAPMOJI-001
    title: "GwapMojis off-chain first"
    status: PRODUCTION
    owner_system: GwapMojis
    decision: "Gift ownership and gifting remain off-chain by default; on-chain minting is optional and explicit."
    review_trigger: "Founder explicitly changes ownership model."
  - id: GWAP-REL-001
    title: "Verifiable Solana releases"
    status: PILOT
    owner_system: PPV
    decision: "For program releases, preserve the exact deterministic build artifact and compare executable hash with deployed program hash."
    review_trigger: "First production-grade verified-build rollout."
  - id: GWAP-PROTO-001
    title: "Protocol claims require activation evidence"
    status: PRODUCTION
    owner_system: GWAP_MASTER
    decision: "SIMD acceptance or implementation does not prove cluster activation; target-cluster evidence is required for live-support claims."
    review_trigger: "Solana changes feature-gate/activation evidence model."
  - id: GWAP-AGENT-001
    title: "Repository-local agent team with task-routed workflows"
    status: PROPOSED
    owner_system: GWAP_MASTER
    decision: "Adopt a six-role agent team (lead, solana, backend, frontend, devops, reviewer) defined in .claude/agents/. The lead routes each task to one workflow in runbooks/AGENT_WORKFLOWS.md. The reviewer is the quality gate. Mainnet, authority, custody, and spending actions stay founder-gated."
    why: "Specialist roles keep each layer deep. An independent reviewer catches author blind spots. Task-routed workflows keep small fixes light and high-risk changes gated."
    authoritative_sources: ["MASTER.md", "systems/engineering-intelligence/SKILL.md", "runbooks/DECISION_WORKFLOW.md"]
    security_boundary: "Agents use repo tools only. The reviewer is read-only. Agent definitions contain no secrets. Any HALT action requires founder approval."
    review_trigger: "First production release run by the team, or any change to agent tool grants or the HALT list."
  - id: GWAP-OWN-001
    title: "GWAP Support Bot is its own system under Tha GwapSpot"
    status: PRODUCTION
    owner_system: Tha_GwapSpot
    decision: "The Telegram support bot for all GWAP projects (FAQ answers, tickets, human escalation) is a separate system from the Lil Gwapz bot and belongs to Tha GwapSpot overall."
    why: "Founder decision recorded 2026-10-13."
    authoritative_sources: ["registries/PRODUCT_TRUTH.yaml"]
    security_boundary: "Support escalations must not gain payment or identity authority. Any bot token is a platform secret."
    review_trigger: "Support bot is merged into another system, or it starts handling payments."
  - id: GWAP-OWN-002
    title: "DIMI is its own system"
    status: PRODUCTION
    owner_system: DIMI
    decision: "DIMI, the music and creator economy layer, is its own system."
    why: "Founder decision recorded 2026-10-13."
    authoritative_sources: ["registries/PRODUCT_TRUTH.yaml"]
    security_boundary: "Rights attestations and payouts follow the PPV and payment boundaries in GWAP-PAY-001 and GWAP-PPV-001."
    review_trigger: "DIMI payouts or rights attestation go live, or ownership changes."
  - id: GWAP-OWN-003
    title: "GwapOS owns the Lil Gwapz premium unlock"
    status: PRODUCTION
    owner_system: GwapOS
    decision: "GwapOS owns the entitlement that unlocks animated Lil Gwapz stickers. The unlock can be granted by a one-time card purchase or by holding a .gwap name on devnet."
    why: "Founder decision recorded 2026-10-13."
    authoritative_sources: ["registries/PRODUCT_TRUTH.yaml", "registries/DECISION_REGISTRY.yaml"]
    security_boundary: "Card payments stay on Stripe (GWAP-PAY-001). Name holdings are read from GNS. The client never supplies proof of payment or ownership that the server has not verified."
    review_trigger: "Unlock moves to mainnet, or a new unlock method is added."
  - id: GWAP-OWN-004
    title: "GWAPLINK is the public profile layer of GNS"
    status: PRODUCTION
    owner_system: GNS
    decision: "GWAPLINK, the public profile layer for GNS names, belongs to GNS. It is currently in staging."
    why: "Founder decision recorded 2026-10-13."
    authoritative_sources: ["registries/PRODUCT_TRUTH.yaml"]
    security_boundary: "PROPOSED, not yet founder-confirmed: profile pages read GNS identity data and do not write identity state."
    review_trigger: "GWAPLINK goes live, or on-chain profile_uri pinning is added."
  - id: GWAP-OWN-005
    title: "GwapSpot Browser is its own system, consumed by GwapOS"
    status: PRODUCTION
    owner_system: GwapSpot_Browser
    decision: "GwapSpot Browser is its own system. GwapOS uses it inside GwapOS. Its framework is not yet decided."
    why: "Founder decision recorded 2026-10-13."
    authoritative_sources: ["registries/PRODUCT_TRUTH.yaml"]
    security_boundary: "PROPOSED, not yet founder-confirmed: the browser holds no signing keys. Transactions are approved through the GwapOS wallet and auth flow."
    review_trigger: "The framework is chosen, or the browser ships outside GwapOS."
  - id: GWAP-OWN-006
    title: "Lil Gwapz belongs to GwapSpot"
    status: PRODUCTION
    owner_system: Tha_GwapSpot
    decision: "Lil Gwapz, including its Telegram bot, sticker sets, and lilgwapz.xyz site, is a GwapSpot production under Tha GwapSpot."
    why: "Founder decision recorded 2026-10-13."
    authoritative_sources: ["registries/PRODUCT_TRUTH.yaml"]
    security_boundary: "The bot token is a platform secret. The premium unlock stays with GwapOS (GWAP-OWN-003)."
    review_trigger: "Lil Gwapz becomes its own system, or the bot starts handling payments."

  - id: GWAP-INFRA-001
    title: "GWAP web services consolidated on Vercel and Render"
    status: PILOT
    owner_system: GWAP_MASTER
    decision: "Frontends deploy to Vercel. The GNS backend and GwapIntel wallet-intelligence deploy to Render, defined in the repo-root render.yaml Blueprint. Railway is no longer a deployment target; its config is removed in gns-decent-deploy PR #78 (chore/vercel-render-only). MongoDB Atlas stays until GWAP-DATA-001 is implemented."
    why: "Founder direction, 2026-10-14: reduce the number of hosting platforms. Render has no managed MongoDB, which is why the data-layer move is recorded separately."
    alternatives: ["Keep Vercel, Render, Railway, and Atlas (status quo, four platforms)", "Render for everything, including frontends (rejected: Vercel already serves the Next.js and CRA frontends and the /s/:name rewrite)"]
    authoritative_sources: ["render.yaml", "frontend/vercel.json", "registries/PRODUCT_TRUTH.yaml"]
    security_boundary: "Secrets live only in Vercel and Render secret stores, never in the repo. Deleting Railway or Atlas resources, DNS or domain changes, and data deletion are founder actions."
    review_trigger: "A required capability is unavailable on Vercel or Render, or Render's free Postgres deletion policy changes the production plan."
    approved_by: "Founder (Papi Gwap), via chat 2026-10-14: 'Do whatever is recommended'"
    approved_at: "2026-10-14"
  - id: GWAP-DATA-001
    title: "GNS backend data layer moves from MongoDB Atlas to Render Postgres"
    status: PILOT
    owner_system: GNS
    decision: "Move the four backend collections (names, profile_metadata, payment_settings, poh_verifications) from MongoDB to Postgres on Render. The data-access code lives in backend/server.py. Wallet-intelligence already uses Postgres on Render and is not affected."
    why: "Render has no managed MongoDB, so removing Atlas under GWAP-INFRA-001 requires this move. The Mongo surface is contained in one file (about 50 lines touching the four collections). The move is a rewrite, so it is a separate PR, not part of the hosting change."
    alternatives: ["Run MongoDB as a container on a Render persistent disk (rejected: operating a database by hand, no managed backups)", "Keep Atlas as a third platform (rejected by founder direction)"]
    authoritative_sources: ["backend/server.py", "render.yaml", "docs/gns-v2/integration-guide.md"]
    security_boundary: "payment_settings and poh_verifications hold sensitive records. The migration keeps the same access rules, and no connection strings are committed. Atlas is kept until the new store is verified."
    implementation: "Not started. Requires a schema design, a V-workflow implementation on a feature branch, backend tests against Postgres, and gwap-reviewer PASS before merge."
    rollback: "Keep Atlas data and the MONGO_URL path until the Postgres path has passed verification."
    review_trigger: "Migration verification fails, or the schema for names changes."
    approved_by: "Founder (Papi Gwap), via chat 2026-10-14: 'Do whatever is recommended'"
    approved_at: "2026-10-14"
  - id: GWAP-GNS-001
    title: "Fresh start for GNS on devnet; legacy 6cDC names are not migrated"
    status: PILOT
    owner_system: GNS
    decision: "The canonical devnet GNS program is A9SCN6tgaoAEorFzY5ZPinruk8LCttmrAEU9JoAmUKUH, deployed 2026-10-14 with V1 and V2 config initialized. Names registered under the earlier program 6cDCrNYmasd1qmnvdLf8jyt9iFa3jW9VLzJhrb7X7SEH are not migrated and are no longer reserved. Before the reservation rule is dropped, the 66 names and 27 owners on 6cDC are recorded in evidence/2026-10-14-6cDC-name-owner-snapshot.json."
    why: "Founder decision, 2026-10-14: start fresh and forget the already-registered names. The snapshot is kept because docs/mainnet-cutover-plan.md requires an owner snapshot before any mainnet flip."
    alternatives: ["Migrate the 66 names to A9SC with migrate_name (rejected by founder)", "Keep 6cDC as the canonical program and upgrade it (rejected: its legacy accounts would sit under changed code)"]
    authoritative_sources: ["evidence/2026-10-14-6cDC-name-owner-snapshot.json", "docs/mainnet-cutover-plan.md", "registries/PRODUCT_TRUTH.yaml"]
    pinned_versions: ["anchor-lang 0.30.1 (programs/Anchor.toml)"]
    security_boundary: "Upgrade authority DPXuqzM51BfjRoCRsmCSUGLjt6RBet9wxQidfoSQb5yJ stays with the founder. Devnet only; no mainnet deploy or authority change under this record."
    implementation: "Open. programs/gwap_names/src/lib.rs, programs/Anchor.toml, and about 35 references across backend, frontend, gwap-names, and scripts still name 6cDC. They must move to A9SC before any release. The release then follows the Solana release-integrity steps (repo SHA, deterministic build, .so hash, deploy, on-chain hash comparison)."
    deployment_evidence: ["Devnet deploy signature 5XS977E8UWHLwfZn5ZopmMjUGmAX2cmCsJsd5EzKuP4A3WrfiM7da66e9ovBjc3EeHt8XrNLrgQRfroxLQK16pme (program A9SCN6tgaoAEorFzY5ZPinruk8LCttmrAEU9JoAmUKUH)", "Verification 7 passed, 0 failed, 2 skipped. No on-chain hash comparison recorded yet."]
    review_trigger: "Any mainnet step, or a finding that the deployed binary does not match a built commit."
    approved_by: "Founder (Papi Gwap), via chat 2026-10-14: 'Do whatever is recommended'"
    approved_at: "2026-10-14"
    impact: "Holders of .gwap names that exist only on 6cDC lose the Lil Gwapz premium unlock once its reads move to A9SC (GWAP-OWN-003 reads name holdings from GNS). Founder decision still open: keep reads on 6cDC for the unlock, or grant another path."
