version: "1.0.0"
updated_at: "2026-10-24"
decisions:
  - id: GWAP-ARCH-001
    title: "GWAP ecosystem separation"
    status: PRODUCTION
    owner_system: GWAP_MASTER
    decision: "Keep identity, reputation, proof/commerce, application orchestration, payments, and digital assets as separate bounded domains."
    why: "Not recorded when this decision was created (2026-09-30)."
    authoritative_sources: ["MASTER.md (Core ownership boundaries)", "registries/PRODUCT_TRUTH.yaml"]
    security_boundary: "MASTER.md signer and authority model: keep the user wallet, Kora fee payer, PPV program upgrade authority, PPV custody authority, GWAP treasury, and automation/agent credentials separate."
    review_trigger: "Major product merger or protocol ownership change."
  - id: GWAP-PPV-001
    title: "PPV staged deployment"
    status: DEVNET_VERIFIED
    owner_system: PPV
    decision: "Core and Commerce may integrate on devnet; Escrow/custody remains gated; mainnet custody disabled."
    why: "Not recorded when this decision was created (2026-09-30)."
    authoritative_sources: ["registries/PRODUCT_TRUTH.yaml (PPV custody)", "MASTER.md (PPV)"]
    security_boundary: "PPV custody is DISABLED on mainnet and CONTROLLED on devnet (PRODUCT_TRUTH.yaml). Escrow or custody activation needs explicit founder approval."
    review_trigger: "Explicit mainnet custody authorization and security review."
  - id: GWAP-PAY-001
    title: "Separate payment responsibilities"
    status: RESEARCHED
    owner_system: GwapOS
    decision: "Stripe, MPP/x402 Pay/Pay Kit, Kora, and PPV serve different boundaries and must not be collapsed into one payment subsystem."
    why: "Not recorded when this decision was created (2026-09-30)."
    authoritative_sources: ["MASTER.md (Payment layer, Agentic-payment model)"]
    security_boundary: "The payment rails are complementary, not interchangeable. Model intent is never financial authorization (MASTER.md)."
    review_trigger: "Production agentic-payment or fee-sponsorship launch."
  - id: GWAP-ASSET-001
    title: "Digital assets are outcome-driven"
    status: PRODUCTION
    owner_system: GwapMojis
    decision: "Do not tokenize by default. Compare off-chain state, custom state, Token-2022, MPL Core, Token Metadata, Bubblegum, and validated inscription primitives."
    why: "Not recorded when this decision was created (2026-09-30)."
    authoritative_sources: ["MASTER.md (Digital asset layer, Digital-asset model)"]
    security_boundary: "No token or NFT primitive is chosen before the user outcome justifies on-chain ownership (MASTER.md)."
    review_trigger: "Optional Solana minting enters implementation."
  - id: GWAP-GWAPMOJI-001
    title: "GwapMojis off-chain first"
    status: PRODUCTION
    owner_system: GwapMojis
    decision: "Gift ownership and gifting remain off-chain by default; on-chain minting is optional and explicit."
    why: "Not recorded when this decision was created (2026-09-30)."
    authoritative_sources: ["registries/PRODUCT_TRUTH.yaml (GwapMojis ownership_model)", "MASTER.md (Digital asset layer)"]
    security_boundary: "Minting happens only as an explicit user action (PRODUCT_TRUTH.yaml: optional_mint EXPLICIT_USER_ACTION)."
    review_trigger: "Founder explicitly changes ownership model."
  - id: GWAP-REL-001
    title: "Verifiable Solana releases"
    status: PILOT
    owner_system: PPV
    decision: "For program releases, preserve the exact deterministic build artifact and compare executable hash with deployed program hash."
    why: "Not recorded when this decision was created (2026-09-30)."
    authoritative_sources: ["MASTER.md (Release-integrity model)"]
    security_boundary: "IDL verification and binary verification are independent gates; neither replaces the other (MASTER.md)."
    review_trigger: "First production-grade verified-build rollout."
  - id: GWAP-PROTO-001
    title: "Protocol claims require activation evidence"
    status: PRODUCTION
    owner_system: GWAP_MASTER
    decision: "SIMD acceptance or implementation does not prove cluster activation; target-cluster evidence is required for live-support claims."
    why: "Not recorded when this decision was created (2026-09-30)."
    authoritative_sources: ["MASTER.md (Protocol evidence model)"]
    security_boundary: "A proposal being accepted does not prove activation. A local validator passing does not prove mainnet support (MASTER.md)."
    review_trigger: "Solana changes feature-gate/activation evidence model."
  - id: GWAP-AGENT-001
    title: "Repository-local agent team with task-routed workflows"
    status: PROPOSED
    owner_system: GWAP_MASTER
    decision: "Adopt a six-role agent team (lead, solana, backend, frontend, devops, reviewer) defined in .claude/agents/. The lead routes each task to one workflow in runbooks/AGENT_WORKFLOWS.md. The reviewer is the quality gate. Mainnet, authority, custody, and spending actions stay founder-gated."
    why: "Specialist roles keep each layer deep. An independent reviewer catches author blind spots. Task-routed workflows keep small fixes light and high-risk changes gated."
    authoritative_sources: ["MASTER.md", "systems/engineering-intelligence/SKILL.md", "runbooks/DECISION_WORKFLOW.md"]
    security_boundary: "Agents use repo tools only. The reviewer is read-only. Agent definitions contain no secrets. Any HALT action requires founder approval."
    review_trigger: "First production release run by the team, or any change to agent tool grants or the HALT list."
  - id: GWAP-OWN-001
    title: "GWAP Support Bot is its own system under Tha GwapSpot"
    status: PRODUCTION
    owner_system: Tha_GwapSpot
    decision: "The Telegram support bot for all GWAP projects (FAQ answers, tickets, human escalation) is a separate system from the Lil Gwapz bot and belongs to Tha GwapSpot overall."
    why: "Founder decision recorded 2026-10-13."
    authoritative_sources: ["registries/PRODUCT_TRUTH.yaml"]
    security_boundary: "Support escalations must not gain payment or identity authority. Any bot token is a platform secret."
    review_trigger: "Support bot is merged into another system, or it starts handling payments."
  - id: GWAP-OWN-002
